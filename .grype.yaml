# Ngoại lệ có hạn cho gói chưa nâng tương thích được (docs/ops/VULN-SLA.md; D-067/D-109).
# Đúng mã + gói/phiên bản; hạn tối đa 30 ngày, critical tối đa 7 ngày; CI kiểm hạn và bảng theo dõi.
# D-140/D-142 (2026-11-01): đã gỡ 4 luật npm sau khi quét base thực dùng bỏ npm và nâng pnpm vá bootstrap undici.
# Không hạ severity/only-fixed hoặc thay scope: build/runtime web và worker dùng cùng base đã được kiểm.
ignore:
  - vulnerability: GHSA-mrhx-c7xc-m3w5
    reason: "zod 3.25.76 chỉ qua @lhci/cli → lighthouse → puppeteer-core → chromium-bidi (công cụ CI, không vào bundle/production); rà 2026-11-17 (D-170): @lhci/cli 0.16.0 bỏ được zod 3 nhưng lighthouse 13.x kéo @sentry/node 11 → sentry@0.49.0 giấy phép FSL-1.1-Apache-2.0 (source-available, sbom-check đỏ) — chờ chủ dự án chọn: nhận FSL (ngoại lệ + ADR) rồi nâng, hoặc thay Lighthouse CI (hạn rà lại: 2026-12-17)"
    package:
      name: zod
      version: 3.25.76
      type: npm
