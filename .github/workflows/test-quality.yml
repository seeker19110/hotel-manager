name: Test quality

# Chất lượng bộ test (PLAN đợt 9 T-805): coverage nhánh + ngưỡng ratchet (QA-COV-001/002/008), PR fix: phải kèm test
# (QA-STRAT-005). Cấu trúc khoá bởi scripts/test-quality.test.mjs. Kiểm OpenAPI phá vỡ hợp đồng ở lát T-801
# (scripts/check-openapi-breaking.mjs, D-062), không dùng oasdiff (action mặc định gửi spec + telemetry ra ngoài).
# Chạy trên MỌI PR vào main (không lọc `paths`). Job mới chưa là required check: đỏ trên PR, chặn merge khi ruleset
# .github/rulesets/main.json được import (D-065). `edited` = sửa tiêu đề/mô tả PR → chạy lại ratchet/fix-requires-test.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  # Sửa tiêu đề/mô tả (`edited`) có nhóm riêng để không huỷ job coverage đang chạy của lần đẩy mã.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unit + db (Postgres 17 thật) với coverage v8 có `branches`; vitest đỏ khi thấp hơn coverage.thresholds trong vitest.config.ts.
  coverage:
    name: coverage
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: pnpm
      - name: Cài phụ thuộc (lockfile đóng băng)
        run: pnpm install --frozen-lockfile
      - name: SeaweedFS cho test file (ADR-0002)
        run: DEV_ENV_OPT_DIR="$RUNNER_TEMP" DEV_ENV_BIN_DIR="$HOME/.local/bin" bash scripts/dev-env-setup.sh --only weed && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test + coverage (nhánh, lines, functions, statements) — đỏ khi thấp hơn ngưỡng
        run: pnpm exec vitest run --coverage
      - name: Lưu báo cáo coverage/
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  # Ngưỡng chỉ được tăng; `exclude` mới cần lý do ở mô tả PR (scripts/check-coverage-ratchet.mjs).
  coverage-ratchet:
    name: coverage-ratchet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
      - name: Lấy nhánh gốc
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"
      - name: So ngưỡng coverage với nhánh gốc
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/check-coverage-ratchet.mjs --base "origin/$BASE_REF" --body-file "$RUNNER_TEMP/pr-body.md"

  # PR `fix:` phải đổi ít nhất một file test (hoặc ghi lý do miễn trừ ở mô tả PR).
  fix-requires-test:
    name: fix-requires-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
      - name: "PR fix: có test thay đổi"
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | node scripts/fix-requires-test.mjs --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
