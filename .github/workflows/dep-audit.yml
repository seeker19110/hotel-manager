name: Dependency audit

# Quét lỗ hổng phụ thuộc npm (BASE-DEP-004, SEC-SUPPLY-006): mỗi PR, push main, hằng tuần và chạy tay.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dep-audit:
    name: dep-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Quét lỗ hổng phụ thuộc chạy thật (đỏ khi có lỗ hổng mức moderate trở lên)
        run: pnpm audit --prod --audit-level moderate
      - name: Kiểm giấy phép (allowlist, chặn AGPL/GPL — BASE-DEP-005)
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm licenses:check
