name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN chỉ đọc cho mọi job (SEC-SUPPLY-001, BASE-GATE-010). Action ghim theo SHA commit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ít job nhất mà không bỏ kiểm nào (ADR-0039 của khung 3.13, D-127): job ngắn gộp vào MỘT job `gate` — zizmor
  # (workflow-lint), typecheck, lint, build → test, diễn tập PITR (backup-restore); trong job các nhóm độc lập chạy song song
  # (D-128, xem bước "Cổng chuẩn song song"). Số đo PR #112 trước khi gộp: gate 3m30s, typecheck 25s, lint 23s, workflow-lint
  # 9s, backup-restore 49s — mỗi job tốn checkout + cài phụ thuộc + một runner, các repo cùng tài khoản chung trần job đồng
  # thời nên job ngắn làm e2e xếp hàng. Ước tính `gate`: tuần tự ≈ 4m30s–5m; song song ≈ 4m–4m15s (đường dài = cài đặt +
  # typecheck + build → test).
  # Giữ riêng: `e2e` (6 shard, không `needs` — nhận runner ngay) và `onboarding-smoke` (~3 phút trên runner mới, chính nó
  # là phép đo "clone sạch → test"; gộp vào gate thì gate ≈ 7m30s, thành đường dài nhất và mất tính "runner mới").
  # Build và test KHÔNG tách: test quét bundle client (client-bundle, secure-defaults-bundle, command-inputs) đọc
  # `apps/web/.next/static` và tự bỏ qua khi chưa build.
  # Ruleset `.github/rulesets/main.json` đòi 2 check: quality (job gom ở cuối file, `needs` mọi job PR của ci.yml) và gitleaks
  # (secret-scan.yml). Job con không đứng riêng trong ruleset: `quality` đỏ khi bất kỳ job con không `success` (WF-CI-001).
  gate:
    name: gate
    runs-on: ubuntu-24.04
    # Trần thời gian (không phải ngưỡng chất lượng): gate 20 + phần việc gộp thêm; zizmor và PITR có trần riêng trong nhóm
    # (`timeout 5m`/`timeout 15m`, như job cũ).
    timeout-minutes: 30
    services:
      postgres:
        # Cùng tag + digest với deploy/postgres/Dockerfile (BASE-DEP-008: ghim digest; scripts/check-image-pins.mjs kiểm).
        image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Postgres 17 cho project `db` của Vitest (runner dùng DATABASE_URL nếu có — PLAN T-005). Chỉ dùng trong CI.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      I18N_REQUIRE_BASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # test ratchet i18n so baseline với origin/main (scripts/i18n.test.mjs)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cài phụ thuộc (lockfile đóng băng — BASE-DEP-002)
        run: pnpm install --frozen-lockfile
      # T-011: object storage tự host (ADR-0002) cho test file riêng tư — binary kiểm SHA-256 trong script.
      - name: SeaweedFS cho test file (PLAN T-011)
        run: DEV_ENV_OPT_DIR="$RUNNER_TEMP" DEV_ENV_BIN_DIR="$HOME/.local/bin" bash scripts/dev-env-setup.sh --only weed && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # DB-SEC-003: test connection-tls.db.test.ts tự initdb cluster Postgres 17 nạp deploy/postgres/pg_hba.conf (hostssl + scram) —
      # cần binary PG 17 (service container chỉ phục vụ TEST_DATABASE_URL). Không tạo cluster mặc định (xem script). Cùng bước
      # cài pgBackRest cho nhóm PITR.
      - name: PostgreSQL 17 binary cho test TLS CSDL (DB-SEC-003)
        run: bash scripts/dev-env-setup.sh --only postgres
      # D-128 (song song tối đa trong số job tối thiểu): các nhóm độc lập chạy nền CÙNG LÚC trong job này, mỗi nhóm log riêng
      # (in khi nhóm xong, theo thứ tự xong), `wait` từng PID, đỏ nếu bất kỳ nhóm nào đỏ. Nhóm chọn theo đọc mã, không đoán:
      # - zizmor (WF-CI-004, trước là job `workflow-lint`): ghim phiên bản + hash ở `.github/requirements-zizmor.txt`, offline,
      #   mọi finding đều đỏ; chỉ đọc `.github/workflows`.
      # - typecheck → build → test: typecheck KHÔNG chạy cùng build — `next build` ghi `apps/web/next-env.d.ts` (import
      #   `.next/types/routes.d.ts`) và có thể ghi tsconfig.json, mà `tsc -p apps/web/tsconfig.json` include `next-env.d.ts`.
      #   Build và test không tách: test quét bundle client trong `apps/web/.next/static`, tự bỏ qua khi chưa build.
      # - lint (biome · spectral · licenses · ci-check): chỉ đọc; biome bỏ `.next`, `next-env.d.ts` và file gitignore (vcs),
      #   spectral đọc `apps/web/openapi.json` đã commit (build/test không ghi).
      # - PITR (PLAN T-012, ADR-0002; trước là job `backup-restore`): cluster tạm trong `mktemp -d`, cổng ngẫu nhiên, repo
      #   pgBackRest cục bộ mã hoá, dữ liệu giả — không đụng service 5432 hay cluster TLS của test. Trần 15 phút như job cũ.
      # SEC-SECRET-007: log mọi nhóm nằm trong ci-logs, gitleaks quét TRƯỚC khi lưu làm artifact; có bí mật → đỏ, không lưu.
      - name: Cổng chuẩn song song — zizmor ∥ (typecheck → build → test) ∥ lint ∥ PITR, đúng lệnh trong xt.yaml
        shell: bash
        run: |
          set +e # tự gom exit của từng nhóm; pipefail (mặc định của shell bash trên Actions) giữ trong subshell
          L="$RUNNER_TEMP/ci-logs"
          mkdir -p "$L"
          pids=() names=()
          (
            timeout 5m python3 -m venv "$RUNNER_TEMP/zizmor-venv" &&
              timeout 5m "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet --require-hashes -r .github/requirements-zizmor.txt &&
              timeout 5m "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline --no-progress .github/workflows
          ) >"$L/zizmor.log" 2>&1 &
          pids+=($!) names+=(zizmor)
          (
            .xtemplates/scripts/dev-task.sh lint
          ) >"$L/lint.log" 2>&1 &
          pids+=($!) names+=(lint)
          (
            timeout 15m bash scripts/db-backup-restore-check.sh
          ) >"$L/pitr.log" 2>&1 &
          pids+=($!) names+=(pitr)
          (
            .xtemplates/scripts/dev-task.sh typecheck >"$L/typecheck.log" 2>&1 &&
              { .xtemplates/scripts/dev-task.sh build && .xtemplates/scripts/dev-task.sh test; } 2>&1 | tee "$RUNNER_TEMP/ci-logs/gate.log" >/dev/null
          ) &
          pids+=($!) names+=(gate)
          # `wait <PID>` từng nhóm (không `wait -n`: nhóm đã xong trước lời gọi có thể bị bỏ sót → vòng lặp không dứt). Nhóm ngắn
          # đứng trước nên log in gần lúc nhóm xong; nhóm dài nhất (gate) cuối.
          fail=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}"
            rc=$?
            name="${names[$i]}"
            echo "::group::$name — exit $rc"
            if [ "$name" = gate ]; then cat "$L/typecheck.log" "$L/gate.log" 2>/dev/null; else cat "$L/$name.log"; fi
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::Nhóm $name đỏ (exit $rc)"
              fail=1
            fi
          done
          exit "$fail"
      - name: Cài gitleaks (ghim phiên bản, kiểm SHA-256)
        if: always()
        run: DEV_ENV_OPT_DIR="$RUNNER_TEMP" DEV_ENV_BIN_DIR="$HOME/.local/bin" bash scripts/dev-env-setup.sh --only gitleaks && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: gitleaks quét log CI (SEC-SECRET-007)
        id: log-scan
        if: always()
        run: gitleaks dir "$RUNNER_TEMP/ci-logs" --no-banner --redact --verbose
      - name: Lưu log CI (đã quét sạch bí mật)
        if: always() && steps.log-scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-gate
          path: ${{ runner.temp }}/ci-logs/
          retention-days: 14
      - name: Tiêu đề PR theo Conventional Commits, ≤ 72 ký tự
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+$' \
            && [ "${#TITLE}" -le 72 ] || { echo "::error::Tiêu đề PR phải dạng '<type>(scope): mô tả' và ≤ 72 ký tự: $TITLE"; exit 1; }

  # E2E (SPEC-pwa, PLAN T-013/T-014): build production + e2e/server.ts (Postgres service + seed giả) + Playwright Chromium.
  # Song song tối đa: 6 shard (mỗi runner Postgres + cặp server riêng), trong shard hai project mobile/desktop chạy cùng lúc
  # (apps/web/playwright.config.ts). 4 → 6 (khung 3.12.0, WF-CI-025): với 4 shard, e2e (1/4) 4m22s là đường găng của cả CI
  # (shard chia theo file, 14 spec); 6 shard ≈ 2–3 spec mỗi shard. timeout 15 (D-092: đo 2m19–3m33/shard trên main, run 39688644466 — siết từ 40
  # để tổng timeout mỗi PR vừa ngân sách 600 phút khi khôi phục cổng harden; không nới trần).
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "1/6", shard: "1/6" }
          - { name: "2/6", shard: "2/6" }
          - { name: "3/6", shard: "3/6" }
          - { name: "4/6", shard: "4/6" }
          - { name: "5/6", shard: "5/6" }
          - { name: "6/6", shard: "6/6" }
    services:
      postgres:
        # Cùng tag + digest với deploy/postgres/Dockerfile (BASE-DEP-008: ghim digest; scripts/check-image-pins.mjs kiểm).
        image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cài phụ thuộc (lockfile đóng băng)
        run: pnpm install --frozen-lockfile
      - name: Chromium cho Playwright (đúng bản của @playwright/test đã ghim)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E — pwa + smoke (một shard)
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter web exec playwright test --shard="$SHARD"
      # CMP-PRIV-008 (D-072): log server của lượt E2E (apps/web/e2e-logs, dữ liệu giả) không được chứa PII chưa che — thay cho
      # quét log staging tới khi có staging. Chạy cả khi E2E đỏ để log lỗi cũng được quét.
      - name: Quét PII trong log server E2E (CMP-PRIV-008)
        if: ${{ !cancelled() }}
        run: node scripts/pii-log-scan.mjs apps/web/e2e-logs
      # SEC-SECRET-007: trace/ảnh chụp của Playwright có thể chứa cookie, header, giá trị form — gitleaks quét (cả bên trong
      # trace.zip) TRƯỚC khi lưu; có bí mật → đỏ, không lưu.
      - name: Cài gitleaks (ghim phiên bản, kiểm SHA-256)
        if: failure()
        run: DEV_ENV_OPT_DIR="$RUNNER_TEMP" DEV_ENV_BIN_DIR="$HOME/.local/bin" bash scripts/dev-env-setup.sh --only gitleaks && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: gitleaks quét trace Playwright (SEC-SECRET-007)
        id: trace-scan
        if: failure()
        run: gitleaks dir apps/web/test-results --max-archive-depth 3 --no-banner --redact --verbose
      - name: Lưu trace khi đỏ (dữ liệu giả, đã quét sạch bí mật)
        if: failure() && steps.trace-scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: apps/web/test-results/
          retention-days: 7

  protection-guard:
    name: protection-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required check trong ruleset ↔ job có thật
        run: |
          set -euo pipefail
          jobs=$(python3 - <<'PY'
          import glob, re
          names = set()
          token = "$" + "{{ matrix.name }}"
          for f in glob.glob(".github/workflows/*.yml"):
              txt = open(f, encoding="utf-8").read()
              m = re.search(r"^jobs:\n(.*)", txt, re.S | re.M)
              if not m: continue
              for jm in re.finditer(r"^  ([A-Za-z0-9_-]+):\n((?:    .*\n|\n)*)", m.group(1), re.M):
                  key, body = jm.group(1), jm.group(2)
                  nm = re.search(r"^    name:\s*(.+?)\s*$", body, re.M)
                  label = nm.group(1).strip('"\'') if nm else key
                  if token in label:
                      # Job ma trận: GitHub đặt context theo từng phần tử `matrix.include[].name`.
                      sm = re.search(r"^    strategy:\n((?:      .*\n|\n)*)", body, re.M)
                      for im in re.finditer(r"^\s+- name:\s*(\S+)\s*$", sm.group(1) if sm else "", re.M):
                          names.add(label.replace(token, im.group(1)))
                  else:
                      names.add(label)
          print("\n".join(sorted(names)))
          PY
          )
          fail=0
          while IFS= read -r c; do
            grep -Fxq -- "$c" <<<"$jobs" || { echo "::error::Required check '$c' không khớp job nào trong .github/workflows/"; fail=1; }
          done < <(python3 -c "import json;[print(x['context']) for r in json.load(open('.github/rulesets/main.json'))['rules'] if r['type']=='required_status_checks' for x in r['parameters']['required_status_checks']]")
          [ "$fail" = 0 ] && echo "OK — mọi required check đều là job có thật."
          exit $fail
      - name: Ruleset trên nhánh mặc định đang hiệu lực? (cảnh báo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          rules=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rules/branches/$BRANCH" || echo "[]")
          for t in pull_request required_status_checks deletion non_fast_forward; do
            if ! python3 -c "import json,sys; r=json.loads(sys.argv[1]); sys.exit(0 if any(x.get('type')==sys.argv[2] for x in r) else 1)" "$rules" "$t"; then
              echo "::warning::Nhánh $BRANCH chưa có rule '$t' — import .github/rulesets/main.json (Settings → Rules → Rulesets → Import)."
            fi
          done
          echo "Đã kiểm ruleset (cảnh báo nếu thiếu)."

  # Onboarding (XC-DX-001): clone sạch → đúng 3 lệnh ở đầu README → test xanh, trên runner mới, có đo thời gian.
  # Bước chạy PHẢI trùng nguyên văn khối lệnh "Bắt đầu nhanh" của README (test scripts/ci-gates.test.mjs khoá).
  # Không dùng setup-node/pnpm-action: chính dev-env-setup.sh cài Node + pnpm.
  onboarding-smoke:
    name: onboarding-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bắt đầu đo thời gian
        run: echo "ONBOARD_T0=$(date +%s)" >> "$GITHUB_ENV"
      # Đúng khối lệnh README, nguyên văn, một shell (dòng 1 có `export PATH` nên các dòng sau thấy node/pnpm vừa cài). Không bước PATH riêng.
      - name: Khối lệnh "Bắt đầu nhanh" của README
        run: |
          bash scripts/dev-env-setup.sh && export PATH="$HOME/.local/bin:$PATH"
          pnpm install --frozen-lockfile
          pnpm test
      - name: Ghi thời gian từ clone sạch đến test xanh
        if: always()
        run: |
          elapsed=$(( $(date +%s) - ONBOARD_T0 ))
          echo "onboarding-smoke: ${elapsed}s (clone sạch → test)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=onboarding-smoke::${elapsed}s từ clone sạch đến kết quả test"

  # Job gom: luôn chạy (`if: always()`), đỏ khi BẤT KỲ job cổng con không `success` (kể cả skipped/cancelled).
  # Đây là required check duy nhất đại diện cho các cổng của ci.yml (ADR-0003 của khung, WF-CI-001).
  quality:
    name: quality
    if: ${{ always() }}
    needs: [gate, e2e, onboarding-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mọi job cổng phải success
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then echo "::error::Job cổng chưa success: $bad"; exit 1; fi
          echo "OK — mọi job cổng đều success."
