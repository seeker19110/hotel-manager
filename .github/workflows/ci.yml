name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN chỉ đọc cho mọi job (SEC-SUPPLY-001, BASE-GATE-010). Action ghim theo SHA commit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cổng chuẩn: đúng lệnh trong xt.yaml (build · typecheck · lint · test) qua dev-task.sh.
  # Ruleset `.github/rulesets/main.json` đòi đúng 4 check: quality (job gom ở cuối file, `needs` mọi job cổng), protection-guard,
  # gitleaks (secret-scan.yml), dep-audit (dep-audit.yml). Job cổng con (gate, e2e, backup-restore, workflow-lint,
  # onboarding-smoke) không đứng riêng trong ruleset: `quality` đỏ khi bất kỳ job con không `success` (WF-CI-001).
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Postgres 17 cho project `db` của Vitest (runner dùng DATABASE_URL nếu có — PLAN T-005). Chỉ dùng trong CI.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: pnpm
      - name: Cài phụ thuộc (lockfile đóng băng — BASE-DEP-002)
        run: pnpm install --frozen-lockfile
      # T-011: object storage tự host (ADR-0002) cho test file riêng tư — binary kiểm SHA-256 trong script.
      - name: SeaweedFS cho test file (PLAN T-011)
        run: DEV_ENV_OPT_DIR="$RUNNER_TEMP" DEV_ENV_BIN_DIR="$HOME/.local/bin" bash scripts/dev-env-setup.sh --only weed && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # DB-SEC-003: test connection-tls.db.test.ts tự initdb cluster Postgres 17 nạp deploy/postgres/pg_hba.conf (hostssl + scram) —
      # cần binary PG 17 (service container chỉ phục vụ TEST_DATABASE_URL). Không tạo cluster mặc định (xem script).
      - name: PostgreSQL 17 binary cho test TLS CSDL (DB-SEC-003)
        run: bash scripts/dev-env-setup.sh --only postgres
      - name: Cổng chuẩn — đúng lệnh trong xt.yaml
        run: .xtemplates/scripts/dev-task.sh gate
      - name: Tiêu đề PR theo Conventional Commits, ≤ 72 ký tự
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+$' \
            && [ "${#TITLE}" -le 72 ] || { echo "::error::Tiêu đề PR phải dạng '<type>(scope): mô tả' và ≤ 72 ký tự: $TITLE"; exit 1; }

  # E2E (SPEC-pwa, PLAN T-013/T-014): build production + e2e/server.ts (Postgres service + seed giả) + Playwright Chromium.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: pnpm
      - name: Cài phụ thuộc (lockfile đóng băng)
        run: pnpm install --frozen-lockfile
      - name: Chromium cho Playwright (đúng bản của @playwright/test đã ghim)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E — pwa + smoke
        run: pnpm --filter web exec playwright test
      - name: Lưu trace khi đỏ (dữ liệu giả)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  # Diễn tập sao lưu/khôi phục PITR (PLAN T-012, ADR-0002): Postgres 17 + pgBackRest từ kho PGDG (kiểm khoá), repo
  # cục bộ mã hoá, dữ liệu giả — chặn hỏng âm thầm của đường khôi phục.
  backup-restore:
    name: backup-restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: pnpm
      - name: Cài phụ thuộc (lockfile đóng băng)
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL 17 + pgBackRest
        run: bash scripts/dev-env-setup.sh --only postgres
      - name: Diễn tập PITR
        run: bash scripts/db-backup-restore-check.sh

  protection-guard:
    name: protection-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required check trong ruleset ↔ job có thật
        run: |
          set -euo pipefail
          jobs=$(python3 - <<'PY'
          import glob, re
          names = set()
          for f in glob.glob(".github/workflows/*.yml"):
              txt = open(f, encoding="utf-8").read()
              m = re.search(r"^jobs:\n(.*)", txt, re.S | re.M)
              if not m: continue
              for jm in re.finditer(r"^  ([A-Za-z0-9_-]+):\n((?:    .*\n|\n)*)", m.group(1), re.M):
                  key, body = jm.group(1), jm.group(2)
                  nm = re.search(r"^    name:\s*(.+?)\s*$", body, re.M)
                  names.add(nm.group(1).strip('"\'') if nm else key)
          print("\n".join(sorted(names)))
          PY
          )
          fail=0
          for c in $(python3 -c "import json;[print(x['context']) for r in json.load(open('.github/rulesets/main.json'))['rules'] if r['type']=='required_status_checks' for x in r['parameters']['required_status_checks']]"); do
            grep -qx "$c" <<<"$jobs" || { echo "::error::Required check '$c' không khớp job nào trong .github/workflows/"; fail=1; }
          done
          [ "$fail" = 0 ] && echo "OK — mọi required check đều là job có thật."
          exit $fail
      - name: Ruleset trên nhánh mặc định đang hiệu lực? (cảnh báo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          rules=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/rules/branches/$BRANCH" || echo "[]")
          for t in pull_request required_status_checks deletion non_fast_forward; do
            if ! python3 -c "import json,sys; r=json.loads(sys.argv[1]); sys.exit(0 if any(x.get('type')==sys.argv[2] for x in r) else 1)" "$rules" "$t"; then
              echo "::warning::Nhánh $BRANCH chưa có rule '$t' — import .github/rulesets/main.json (Settings → Rules → Rulesets → Import)."
            fi
          done
          echo "Đã kiểm ruleset (cảnh báo nếu thiếu)."

  # Lint workflow bằng zizmor (WF-CI-004): template-injection, dangerous-triggers… Bản ghim kèm hash ở
  # `.github/requirements-zizmor.txt`; chạy offline (không cần token), mọi finding đều đỏ.
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cài zizmor (ghim phiên bản + hash)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet --require-hashes -r .github/requirements-zizmor.txt
      - name: zizmor — 0 finding trên .github/workflows
        run: '"$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline --no-progress .github/workflows'

  # Onboarding (XC-DX-001): clone sạch → đúng 3 lệnh ở đầu README → test xanh, trên runner mới, có đo thời gian.
  # Bước chạy PHẢI trùng nguyên văn khối lệnh "Bắt đầu nhanh" của README (test scripts/ci-gates.test.mjs khoá).
  # Không dùng setup-node/pnpm-action: chính dev-env-setup.sh cài Node + pnpm.
  onboarding-smoke:
    name: onboarding-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bắt đầu đo thời gian
        run: echo "ONBOARD_T0=$(date +%s)" >> "$GITHUB_ENV"
      # Đúng khối lệnh README, nguyên văn, một shell (dòng 1 có `export PATH` nên các dòng sau thấy node/pnpm vừa cài). Không bước PATH riêng.
      - name: Khối lệnh "Bắt đầu nhanh" của README
        run: |
          bash scripts/dev-env-setup.sh && export PATH="$HOME/.local/bin:$PATH"
          pnpm install --frozen-lockfile
          pnpm test
      - name: Ghi thời gian từ clone sạch đến test xanh
        if: always()
        run: |
          elapsed=$(( $(date +%s) - ONBOARD_T0 ))
          echo "onboarding-smoke: ${elapsed}s (clone sạch → test)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=onboarding-smoke::${elapsed}s từ clone sạch đến kết quả test"

  # Job gom: luôn chạy (`if: always()`), đỏ khi BẤT KỲ job cổng con không `success` (kể cả skipped/cancelled).
  # Đây là required check duy nhất đại diện cho các cổng của ci.yml (ADR-0003 của khung, WF-CI-001).
  quality:
    name: quality
    if: ${{ always() }}
    needs: [gate, e2e, backup-restore, workflow-lint, onboarding-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mọi job cổng phải success
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then echo "::error::Job cổng chưa success: $bad"; exit 1; fi
          echo "OK — mọi job cổng đều success."
