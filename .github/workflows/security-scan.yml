name: Security scan

# SAST (Semgrep OSS, luật tự viết trong security/semgrep — offline, không gọi dịch vụ ngoài) và DAST (OWASP ZAP baseline + quét chủ động
# thời gian giới hạn) trên app production chạy thật trong runner với Postgres service (cùng cách job `e2e`). BASE-SEC-007, SEC-WEB-001,
# SEC-WEB-004. Cổng DAST: scripts/zap-gate.mjs — đỏ khi có cảnh báo mức Medium trở lên chưa nằm trong security/zap/allowlist.json.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cài Semgrep OSS (bản ghim trong security/semgrep/requirements.txt)
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --no-cache-dir --require-virtualenv --require-hashes -r security/semgrep/requirements.txt
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
      - name: Luật đỏ khi mẫu xấu lọt, xanh khi mẫu tốt (semgrep --test)
        run: semgrep --test security/semgrep --metrics=off --disable-version-check
      - name: Quét mã nguồn — đỏ ở mọi phát hiện (injection SQL/lệnh/đường dẫn, XSS sink, PII vào log)
        run: semgrep scan --config security/semgrep/hm-injection.yml --config security/semgrep/hm-privacy.yml --metrics=off --disable-version-check --error

  dast:
    name: dast
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      E2E_PORT: "3100"
      # ZAP 2.17.0 (index đa kiến trúc, tra ghcr.io 2026-10-18).
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cài phụ thuộc (lockfile đóng băng)
        run: pnpm install --frozen-lockfile
      - name: Build production
        run: pnpm --filter web build
      - name: Khởi động app (Postgres service + seed giả, như job e2e)
        working-directory: apps/web
        run: |
          nohup node e2e/server.ts > "$RUNNER_TEMP/dast-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dast-server.pid"
          for _ in $(seq 1 120); do
            curl -fsS "http://127.0.0.1:${E2E_PORT}/api/health" > /dev/null && exit 0
            sleep 2
          done
          echo "::error::App không lên trong 240 giây"; tail -n 50 "$RUNNER_TEMP/dast-server.log"; exit 1
      - name: Thư mục kết quả ZAP (container chạy bằng người dùng zap)
        run: mkdir -p zap-out && chmod 777 zap-out
      - name: ZAP baseline (quét thụ động, spider 2 phút)
        run: |
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "http://127.0.0.1:${E2E_PORT}" -m 2 -I -J baseline.json -r baseline.html
      - name: ZAP quét chủ động (XSS/injection), giới hạn thời gian
        run: |
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-full-scan.py -t "http://127.0.0.1:${E2E_PORT}" -m 2 -T 12 -I -J active.json -r active.html
      - name: Cổng DAST — đỏ khi còn cảnh báo Medium trở lên ngoài allowlist
        run: node scripts/zap-gate.mjs zap-out/baseline.json zap-out/active.json
      - name: Dừng app (xoá DB tạm)
        if: always()
        run: |
          kill -TERM "$(cat "$RUNNER_TEMP/dast-server.pid")" 2>/dev/null || true
          sleep 3
      - name: Lưu báo cáo ZAP và log app (dữ liệu giả)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap-out/
          retention-days: 7
