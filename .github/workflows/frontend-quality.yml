name: Frontend quality

# Chất lượng frontend (PLAN đợt 9, T-804): build nghiêm theo thứ tự typecheck + lint → build, ngân sách bundle, Lighthouse CI,
# test tất định (TZ cố định, lặp 3 lần), E2E lặp trên hai project, rào hồi quy. Chạy trên PR và main; mọi job là
# required check (`.github/rulesets/main.json`, D-065) — xem docs/perf/README.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # FE-BUILD-003: typecheck và lint (0 cảnh báo, FE-BUILD-004) chạy TRƯỚC; build chỉ chạy khi cả hai xanh (needs).
  typecheck:
    name: fe-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: fe-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome — format + lint toàn bộ, 0 cảnh báo (cùng cấu hình/phiên bản với pre-commit)
        run: pnpm lint

  # FE-PERF-004, XC-GREEN-002: ngân sách bundle JS gzip (.size-limit.json; lý do ở docs/PERF-BUDGET.md). Đỏ khi vượt.
  build-size:
    name: bundle-size
    needs: [typecheck, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: size-limit (đỏ khi vượt ngân sách)
        run: pnpm size

  # FE-PERF-002, PRF-WEB-005: Lighthouse mobile, 5 lần chạy lấy median, assert `error` (lighthouserc.json). Server = e2e/server.ts.
  lighthouse:
    name: lighthouse
    needs: [typecheck, lint]
    runs-on: ubuntu-24.04
    # 6 URL × 5 lần đo (PRF-WEB-005).
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Chromium (Playwright, đúng bản đã ghim) cho Lighthouse
        run: pnpm --filter @hm/web exec playwright install --with-deps chromium
      # PRF-WEB-005: 6 URL chính (3 công khai + 3 trang sau đăng nhập của chủ khách sạn giả). Server dựng một lần, phiên lấy bằng
      # e2e/perf-session-env.ts (như k6 nightly), lhci đo với header Cookie từ config sinh tạm (scripts/lhci-auth-config.mjs).
      # Trang sau đăng nhập đứng TRƯỚC trong lighthouserc.json: ghé trang đăng nhập làm phiên đo mất hiệu lực (thử thật 2026-10-18).
      - name: Khởi động app (Postgres service + seed giả, như job e2e)
        working-directory: apps/web
        env:
          E2E_NO_REPLICA: "1"
          E2E_PORT: "3100"
        run: |
          nohup node e2e/server.ts > "$RUNNER_TEMP/lhci-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lhci-server.pid"
          for _ in $(seq 1 120); do
            curl -fsS "http://127.0.0.1:3100/api/health" > /dev/null && exit 0
            sleep 2
          done
          echo "::error::App không lên trong 240 giây"; tail -n 50 "$RUNNER_TEMP/lhci-server.log"; exit 1
      - name: Phiên đăng nhập cho trang sau đăng nhập
        working-directory: apps/web
        env:
          E2E_PORT: "3100"
        run: node e2e/perf-session-env.ts >> "$GITHUB_ENV"
      - name: lhci autorun (5 lần, median; đỏ khi vi phạm assert mức error)
        run: |
          CHROME_PATH="$(pnpm --filter @hm/web exec node -p "require('@playwright/test').chromium.executablePath()")"
          export CHROME_PATH
          node scripts/lhci-auth-config.mjs "$RUNNER_TEMP/lighthouserc.auth.json"
          pnpm exec lhci autorun --config="$RUNNER_TEMP/lighthouserc.auth.json"
          node scripts/lhci-verify.mjs .lighthouseci
      - name: Dừng app (xoá DB tạm)
        if: always()
        run: |
          kill -TERM "$(cat "$RUNNER_TEMP/lhci-server.pid")" 2>/dev/null || true
          sleep 3
      - name: Che cookie phiên trong báo cáo Lighthouse
        if: always()
        run: node scripts/lhci-verify.mjs --scrub .lighthouseci
      - name: Lưu báo cáo Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  # FE-TEST-003: unit chạy 3 lần liên tiếp với TZ/LANG cố định (vitest.config.ts) phải cùng kết quả.
  unit-deterministic:
    name: unit-deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit x3, múi giờ máy chạy khác UTC vẫn phải xanh (cấu hình ghim TZ)
        run: |
          for i in 1 2 3; do
            TZ=Asia/Ho_Chi_Minh pnpm vitest run --project unit || exit 1
          done

  # FE-TEST-002, PRF-WEB-006, UX-RESP-008, FE-TEST-003: E2E luồng chính lặp 3 lần trên CẢ HAI project (mobile + desktop).
  e2e-repeat:
    name: e2e-repeat
    needs: [typecheck, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hm/web exec playwright install --with-deps chromium
      - name: Playwright smoke --repeat-each=3, project mobile và desktop
        run: pnpm --filter @hm/web exec playwright test smoke --repeat-each=3 --project=mobile --project=desktop
      - name: Lưu trace khi đỏ (dữ liệu giả)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-repeat
          path: apps/web/test-results/
          retention-days: 7

  # FE-TEST-006: test component (tầng thấp nhất) của giao diện. Rào "PR fix phải kèm test" là job `fix-requires-test`
  # của `test-quality.yml` (T-805; lắng nghe `edited` để đổi tiêu đề PR chạy lại — workflow này không lắng nghe sự kiện đó).
  regression:
    name: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test component (Testing Library) + rào truy vấn
        run: pnpm vitest run --project unit apps/web/components testing-library-rules
