name: Perf nightly

# Load test tự động (QA-PERF-002, QA-PERF-007; D-072): k6 chạy luồng nóng đọc `perf/k6/room-list.js` với `thresholds` p95/p99 và
# tỷ lệ lỗi (perf/k6/lib.js) — vượt ngưỡng thì k6 thoát ≠ 0, job đỏ. Đích là app dựng TẠM trong runner như job `e2e` (Postgres
# service, seed giả, `next start` production) cho tới khi có staging; KHÔNG BAO GIỜ tải vào production: BASE_URL cố định loopback,
# bước "Chặn đích" đỏ nếu host không phải loopback, và lib.js `assertSafeTarget` chặn lần nữa trong k6.
# Chạy hằng đêm (02:41 giờ VN) và chạy tay. Không chạy trên pull_request (không thuộc ngân sách CI mỗi PR — XC-GREEN-002).
on:
  schedule:
    - cron: "41 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: perf-nightly
  cancel-in-progress: false

jobs:
  k6:
    name: k6
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      E2E_PORT: "3100"
      E2E_NO_REPLICA: "1"
      BASE_URL: http://127.0.0.1:3100
      K6_ALLOWED_HOSTS: 127.0.0.1
      K6_PROFILE: load
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chặn đích production (QA-PERF-007) — chỉ loopback
        run: node scripts/k6-target-guard.mjs "$BASE_URL" "$K6_ALLOWED_HOSTS"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cài phụ thuộc (lockfile đóng băng)
        run: pnpm install --frozen-lockfile
      - name: Chromium cho bước đăng nhập (đúng bản của @playwright/test đã ghim)
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: k6 (ghim phiên bản, kiểm SHA-256)
        run: DEV_ENV_OPT_DIR="$RUNNER_TEMP" DEV_ENV_BIN_DIR="$HOME/.local/bin" bash scripts/dev-env-setup.sh --only k6 && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Build → app tạm loopback → phiên đăng nhập giả → k6 load room-list (đỏ khi vượt thresholds) → quét PII log server (cả khi k6
      # đỏ) → dừng app: cùng script với khoá `perf` của xt.yaml (release-check). Đích cố định 127.0.0.1, script chặn lại lần nữa.
      - name: Load test room-list + quét PII log server (đỏ khi vượt thresholds hoặc lọt PII)
        env:
          PERF_OUT: perf-out
        run: bash scripts/perf-load.sh
      - name: Lưu tóm tắt k6 (số đo, không có cookie)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: perf-out/k6-summary.json
          retention-days: 30
          if-no-files-found: ignore
