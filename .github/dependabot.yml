version: 2
# Cập nhật phụ thuộc tự động, có nhịp (BASE-DEP-007, OPS-MAINT-001): mọi hệ sinh thái có manifest trong repo, lịch tuần
# (thứ Hai, giờ Việt Nam), gom nhóm minor+patch thành một PR, trần PR mở, `cooldown` 14 ngày (không nâng bản mới phát hành
# chưa đủ hai tuần — luật bản phát hành ≥ 2 tuần; cập nhật bảo mật không bị cooldown). Bản major không gom: mỗi bản một PR
# theo mẫu `.github/PULL_REQUEST_TEMPLATE/major-upgrade.md`. Chính sách đầy đủ: docs/ops/DEPENDENCY-POLICY.md.
# Test khoá cấu hình này với manifest thật: scripts/supply-chain.test.mjs (đủ `package-ecosystem`, `groups`, trần PR, lịch tuần).
updates:
  # pnpm workspace (pnpm-lock.yaml ở gốc, MỘT lockfile — FE-BUILD-001) — Dependabot dùng hệ sinh thái `npm` cho pnpm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  # Nâng SHA của action đã ghim (uses: owner/repo@<sha> # vX.Y.Z); gom nhóm để không phình WIP.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
  # Dockerfile (deploy/postgres, deploy/caddy, deploy/seaweedfs, deploy/web.Dockerfile, deploy/worker.Dockerfile): nâng tag + digest
  # của image nền (golang/alpine của image tự dựng — D-110).
  - package-ecosystem: docker
    directories:
      - /deploy
      - /deploy/caddy
      - /deploy/postgres
      - /deploy/seaweedfs
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-images:
        patterns: ["*"]
  # Image trong compose (deploy/compose*.yaml) — hiện mọi service dựng tại chỗ (D-110); giữ mục để image kéo về sau này được nâng.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    commit-message:
      prefix: "build(deps)"
    groups:
      compose-images:
        patterns: ["*"]
  # Module Go của Caddy tự dựng (deploy/caddy/go.mod, D-110): nâng caddy, golang.org/x/* khi có bản vá.
  - package-ecosystem: gomod
    directory: /deploy/caddy
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    commit-message:
      prefix: "build(deps)"
    groups:
      caddy-go-modules:
        patterns: ["*"]
  # Semgrep (security/semgrep/requirements.txt — lock có hash, cài bằng `pip install --require-hashes` ở job sast, T-803).
  - package-ecosystem: pip
    directory: /security/semgrep
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci(deps)"
    groups:
      semgrep:
        patterns: ["*"]
