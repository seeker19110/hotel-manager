    legal_basis: "nghĩa vụ pháp lý — thông báo lưu trú/khai báo tạm trú (đề xuất; nguồn luật chưa đối chiếu bản gốc)"
    retention: "`identity_documents.retention_until` (cột có sẵn; chưa có chính sách đặt giá trị — chờ DPIA); ẩn danh hoá (`anonymized_at`) xoá số, băm và ảnh"
    classification_note: "nhạy cảm theo NĐ 356/2025 — nguồn thứ cấp, chưa đối chiếu bản gốc (PROJECT §6)"
    notes: "Không có số rõ trong CSDL (D-004); khoá ở môi trường (`HM_PII_KEYS`)"
