# Sổ dữ liệu cá nhân (data map) — Hotel Manager (T-309; CMP-PRIV-001, STD-PRIV-002, CMP-INTL-002, CMP-VN-004, CMP-AUDIT-003)
# TRẠNG THÁI: ĐỀ XUẤT. Cơ sở pháp lý, phân loại nhạy cảm và hạn giữ là đề xuất của kỹ thuật, CHỜ DPIA và pháp lý duyệt
# (docs/DPIA.md chưa có — việc của người). Mọi chỗ không chắc ghi "(chưa xác minh)". Không phải tư vấn pháp lý.
# Máy kiểm: packages/app/src/privacy/data-map.db.test.ts — (1) cột có TÊN khớp mẫu PII trong schema public/auth mà chưa khai ở
# `entries` hoặc `not_pii` thì test ĐỎ; (2) mọi cột jsonb và cột chữ tự do (tên memo/note/reason/detail/payload/…) phải được
# khai ở `entries`, `not_pii` hoặc `free_text`; (3) mục khai mà không có thật trong catalog cũng ĐỎ. GIỚI HẠN: rào theo tên cột nên
# cột PII đặt tên lạ (hoặc nhét PII vào cột tự do) máy không thấy — cột tự do phải RÀ TAY (`free_text.risk`), và mỗi migration
# thêm cột nên rà lại mục này. Thêm cột PII mới = thêm dòng ở đây.
# YAML đơn giản (parser tối thiểu trong test): không anchor, không block scalar; `defaults` được trộn vào từng entry.
version: 1
updated: 2026-10-16
status: "đề xuất — chờ DPIA và pháp lý duyệt"
defaults:
  storage: "Postgres 17 tự host (VPS tại VN — chưa mua)"
  backup_copy: "bản sao lưu pgBackRest mã hoá aes-256-cbc ở kho khác máy (chưa chọn)"
  processors: "VPS tự host (chưa chọn); kho sao lưu (chưa chọn)"
  region: "VN (đề xuất — chưa có hạ tầng thật)"
  legal_basis_status: "đề xuất — chờ DPIA và pháp lý duyệt"
