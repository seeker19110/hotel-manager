    classification_note: "nhạy cảm theo NĐ 356/2025 — nguồn thứ cấp, chưa đối chiếu bản gốc (PROJECT §6)"
    notes: "Không có số rõ trong CSDL (D-004); khoá ở môi trường (`HM_PII_KEYS`)"
