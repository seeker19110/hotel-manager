free_text:
  # Cột jsonb và cột chữ tự do (tên khớp memo/note/reason/detail/payload/description/title/snapshot/file_key/error/resolution…):
  # tên cột không nói lên nội dung có PII hay không nên rà TAY từng cột; máy chỉ buộc mọi cột như vậy phải có mặt ở đây.
  # risk: co_the_chua_pii = người dùng nhập/snapshot có thể chứa PII (không nhập PII vào ô tự do; xoá/ẩn danh theo hạn giữ của bảng chủ); khong_pii = mã/enum/băm/số liệu.
