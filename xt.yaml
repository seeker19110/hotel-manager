# xt.yaml — lệnh chuẩn của dự án cho agent và hook (YAML PHẲNG `task: lệnh`, do .xtemplates/scripts/dev-task.sh đọc).
# Agent KHÔNG suy diễn lệnh từ văn xuôi; đọc file này. Để trống "" = không có; thiếu khoá = tự dò (package.json/pyproject/go.mod/Cargo.toml/Makefile).
# Khi autopilot đang chạy, lint/test để "" hoặc lệnh không kiểm gì (true, :, exit 0, echo …) = cổng ĐỎ (ADR-0011): điền ở task đầu PLAN.
# Nhà của bộ khoá: LOOP-HARNESS-008 (framework/11-autonomous-loop/harness-files.md). `scripts/dev-task.sh` CHỈ chạy các khoá format · lint · typecheck · test · build · format_file
# (`gate` = build → typecheck → lint → test; lint nên gồm kiểm format). Khoá khác (install, dev, e2e, migrate, init, smoke, audit…) là lệnh KHAI BÁO để agent ĐỌC và chạy trực tiếp; dev-task không chạy.
# Mẫu theo stack (giữ MỘT bộ, xoá phần còn lại):
#   Node:   lint: npm run lint · typecheck: npm run typecheck · test: npm test -- --run · build: npm run build · format: npm run format · format_file: npx --no-install prettier --write "{}"
#   Python: lint: ruff check . · typecheck: pyright · test: pytest -q · build: "" · format: ruff format . · format_file: ruff format "{}"
#   Go:     lint: go vet ./... · typecheck: "" · test: go test ./... · build: go build ./... · format: gofmt -l -w . · format_file: gofmt -w "{}"
lint: "pnpm lint && pnpm licenses:check && python3 .xtemplates/scripts/xt.py ci-check .github/workflows"
typecheck: "pnpm typecheck"
test: "pnpm test"
build: "pnpm build"
format: "pnpm format"
format_file: "pnpm exec biome format --write \"{}\""
# Merge PR (ADR-0013/0014/0015, LOOP-STOP-022): L3 = mở PR là bật auto-merge của GitHub, merge khi required check xanh (cần bật "Allow auto-merge" + ruleset có required check);
# L2 = máy chỉ tự merge làn nhanh (`xt.py merge-check`); L1 = người merge mọi PR.
# merge_risk_paths: glob thêm vào danh sách đường dẫn nhạy cảm (luôn để người merge), cách nhau dấu phẩy.
# Chủ dự án duyệt L3 ngày 2026-10-17 (trước đó L2 từ 2026-10-16); nhóm tiền/tồn/lưu trú trong merge_risk_paths vẫn luôn để người merge (LOOP-STOP-005).
merge_autonomy: L3
merge_risk_paths: "*/ledger/*, */money/*, */deposits/*, */reconciliation/*, */shifts/*, */lease/*, */stay/*, */rental/*, */approvals/*, */identity/*, */access/*, */tenancy/*, */inventory/*, */metering/*, */notifications/*, */thu-tien/*, */ky-thu/*, */doi-soat/*, */hop-dong/*, */chi-so/*, */webhooks/*, apps/web/app/api/*, packages/db/*"
# Tuỳ chọn, agent đọc và chạy trực tiếp (dev-task không chạy): e2e, audit (dependency), perf (k6/lighthouse), migrate (áp migration local), install, dev, init, smoke
e2e: "pnpm --filter @hm/web exec playwright test"
audit: "pnpm audit --prod"
install: "pnpm install --frozen-lockfile"
init: "bash scripts/dev-env-setup.sh && pnpm install --frozen-lockfile"
