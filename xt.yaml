# xt.yaml — lệnh chuẩn của dự án cho agent và hook (YAML PHẲNG `task: lệnh`, do .xtemplates/scripts/dev-task.sh đọc).
# Agent KHÔNG suy diễn lệnh từ văn xuôi; đọc file này. Để trống "" = không có; thiếu khoá = tự dò (package.json/pyproject/go.mod/Cargo.toml/Makefile).
# Khi autopilot đang chạy, lint/test để "" hoặc lệnh không kiểm gì (true, :, exit 0, echo …) = cổng ĐỎ (ADR-0011): điền ở task đầu PLAN.
# Nhà của bộ khoá: LOOP-HARNESS-008 (framework/11-autonomous-loop/harness-files.md). `scripts/dev-task.sh` CHỈ chạy các khoá format · lint · typecheck · test · build · format_file
# (`gate` = build → typecheck → lint → test; lint nên gồm kiểm format). Khoá khác (install, dev, e2e, migrate, init, smoke, audit…) là lệnh KHAI BÁO để agent ĐỌC và chạy trực tiếp; dev-task không chạy.
# Mẫu theo stack (giữ MỘT bộ, xoá phần còn lại):
#   Node:   lint: npm run lint · typecheck: npm run typecheck · test: npm test -- --run · build: npm run build · format: npm run format · format_file: npx --no-install prettier --write "{}"
#   Python: lint: ruff check . · typecheck: pyright · test: pytest -q · build: "" · format: ruff format . · format_file: case "{}" in *.py) ruff format "{}" ;; esac
#   Go:     lint: go vet ./... · typecheck: "" · test: go test ./... · build: go build ./... · format: gofmt -l -w . · format_file: gofmt -w "{}"
lint: "pnpm lint && pnpm lint:openapi && pnpm licenses:check && python3 .xtemplates/scripts/xt.py ci-check .github/workflows"
typecheck: "pnpm typecheck"
test: "pnpm test"
build: "pnpm build"
format: "pnpm format"
format_file: "pnpm exec biome format --write \"{}\""
# Sàn M/L (LOOP-HARNESS-023, `xt.py doctor` báo `gate-floor`; `loop verify` CHẠY các lệnh sàn): kiểm format không ghi file,
# test có ngưỡng coverage (ngưỡng ở `coverage.thresholds` của vitest.config.ts; project `db` cần Postgres như job `coverage` CI).
# Lệnh kiểm không ghi vào repo: báo cáo coverage ra `mktemp -d`.
format_check: "pnpm exec biome format ."
coverage: "pnpm exec vitest run --coverage --coverage.reportsDirectory=\"$(mktemp -d)\""
# Merge PR (ADR-0013/0014/0015, LOOP-STOP-022): L3 (mặc định) = bật auto-merge của GitHub (làn nhanh khi mở, làn chuẩn sau review sạch — ADR-0024), merge khi required check
# xanh (cần bật "Allow auto-merge" + ruleset có required check; ghi miễn trừ WF-REVIEW-007); L2 = máy chỉ tự merge làn nhanh
# (`xt.py merge-check`); L1 = người merge mọi PR.
# merge_risk_paths: glob thêm vào danh sách đường dẫn nhạy cảm (ngoại lệ cứng, người merge — `merge_hard_exceptions` mặc định human), cách nhau dấu phẩy.
# Chủ dự án duyệt L3 ngày 2026-10-17 (trước đó L2 từ 2026-10-16); nhóm tiền/tồn/lưu trú trong merge_risk_paths vẫn luôn để người merge (LOOP-STOP-005).
merge_autonomy: L3
merge_risk_paths: "*/ledger/*, */money/*, */deposits/*, */reconciliation/*, */shifts/*, */lease/*, */stay/*, */rental/*, */approvals/*, */identity/*, */access/*, */tenancy/*, */inventory/*, */metering/*, */notifications/*, */thu-tien/*, */ky-thu/*, */doi-soat/*, */hop-dong/*, */chi-so/*, */webhooks/*, apps/web/app/api/*, packages/db/*, *vitest.config.*, *playwright.config.*, biome.json*, tsconfig.base.json, */tsconfig.json, xt.yaml, scripts/check-coverage-ratchet.mjs, scripts/fix-requires-test.mjs, .github/workflows/test-quality.yml"
# Tuỳ chọn, agent đọc và chạy trực tiếp (dev-task không chạy): e2e, audit (dependency), perf (k6/lighthouse), migrate (áp migration local), install, dev, init, smoke
e2e: "pnpm --filter @hm/web exec playwright test"
audit: "pnpm audit --prod"
# claude_min_version: phiên bản Claude Code tối thiểu (vd 2.1.200) — `xt.py doctor` cảnh báo khi thấp hơn (LOOP-HARNESS-026).
# Tổ chức ép thật bằng managed settings `requiredMinimumVersion`. Trống = không kiểm.
claude_min_version: ""
dev: "pnpm --filter @hm/web dev"
# Không có lệnh migrate rời: migration áp tự động bởi migrateToLatest khi khởi động (e2e/server.ts, packages/testkit) — để trống = không có (XC-DX-002).
migrate: ""
install: "pnpm install --frozen-lockfile"
init: "bash scripts/dev-env-setup.sh && pnpm install --frozen-lockfile"
# ai_attribution: forbid = guard chặn commit mà message ghi tên model hay URL phiên AI (`Claude-Session:`, `Claude Opus …`)
# — LOOP-HARNESS-027. Trống/allow = không kiểm (trailer `Co-authored-by: Claude <…>` chung luôn được).
ai_attribution: ""
