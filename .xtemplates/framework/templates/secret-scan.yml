# Quét bí mật mẫu cho dự án đích — `install.py --with-github` chép vào `.github/workflows/secret-scan.yml` (copy-if-absent).
# Job `gitleaks` là required check của ruleset mẫu. Không phụ thuộc stack.
name: Secret scan

# Luật "bí mật KHÔNG bao giờ vào Git" (01-baseline/security-minimum, 12-security/secrets-management):
# Gitleaks quét lịch sử của mọi ref đã tải và HEAD trên push, PR và hằng tuần (AUD-CI-027, AUD-CI-030).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "53 2 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Quét lịch sử Git bằng Gitleaks CLI
        run: |
          set -euo pipefail
          # Bản Linux x64 từ trang phát hành chính thức, đối chiếu checksums.txt ngày 2026-11-04.
          asset=gitleaks_8.30.1_linux_x64.tar.gz
          archive="$RUNNER_TEMP/$asset"
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 3 --proto '=https' -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts='--all --diff-merges=first-parent HEAD' \
            --report-format=sarif --report-path="$RUNNER_TEMP/results.sarif" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: gitleaks-results.sarif
          path: ${{ runner.temp }}/results.sarif
          if-no-files-found: ignore
