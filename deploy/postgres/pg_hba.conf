# pg_hba.conf production (DB-SEC-003, OWASP Database Security CS) — nạp bằng `-c hba_file=` trong deploy/compose.yaml.
# Chỉ có hai loại dòng:
#   1. `hostssl … scram-sha-256` — mọi kết nối TCP phải mã hoá TLS và xác thực SCRAM-SHA-256. Không có `host`/`hostnossl`
#      nên kết nối không mã hoá (khách tắt SSL) bị từ chối "no pg_hba.conf entry … no encryption".
#   2. `local … peer` cho đúng role `postgres`: tiến trình pgBackRest/psql chạy bằng người dùng hệ điều hành `postgres`
#      TRONG container (socket Unix, không qua mạng). Role ứng dụng không có đường nào khác ngoài hostssl.
# Không dùng `trust`, `password`, `md5` (scripts/security-scan.test.mjs chặn). `samenet` = chỉ máy cùng mạng docker `backend`
# (internal, không publish cổng).
# TYPE     DATABASE  USER      ADDRESS   METHOD
local      all       postgres            peer
hostssl    all       all       samenet   scram-sha-256
