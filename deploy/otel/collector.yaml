# OpenTelemetry Collector (bản contrib) cho log ứng dụng — OPS-OBS-001. Nhận log JSON một dòng của web/worker
# (packages/app/src/logging/logger.ts; hình dạng ở log-record.schema.json) từ file log container Docker, parse thành
# OTel Logs Data Model, gắn Resource ở Collector, KHÔNG bỏ dòng không parse được (gắn thuộc tính `unparsed`).
#
# Biến môi trường (chỉ của Collector, có mặc định; KHÔNG phải biến của ứng dụng):
#   HM_LOG_INCLUDE      glob file log (mặc định: file json-file của mọi container Docker trên máy)
#   HM_OTEL_STATE_DIR   thư mục lưu offset đọc file (mặc định /var/lib/otelcol) — khởi động lại không mất/lặp dòng
#   HM_LOG_EXPORT_PATH  file JSON Lines đầu ra (mặc định /var/log/hm-otel/logs.jsonl; xoay vòng theo kích thước/tuổi)
#   HM_DEPLOYMENT_ENV   giá trị `deployment.environment` cho dòng KHÔNG có trường `env` (mặc định production)
# Kiểm: `otelcol-contrib validate --config deploy/otel/collector.yaml` và `node scripts/otel-collector-e2e.mjs` (CI: job `otel-collector`).
# Chọn nơi lưu/tra cứu lâu dài (Loki/OpenSearch/…) là quyết định triển khai: thêm exporter OTLP vào pipeline `logs` bên dưới.
extensions:
  file_storage:
    directory: ${env:HM_OTEL_STATE_DIR:-/var/lib/otelcol}
    create_directory: true

receivers:
  # `file_log` = tên mới của receiver `filelog` (bản 0.161 cảnh báo alias cũ).
  file_log/app:
    include:
      - "${env:HM_LOG_INCLUDE:-/var/lib/docker/containers/*/*-json.log}"
    start_at: beginning
    storage: file_storage
    include_file_path: true
    operators:
      # 1) Lớp bọc của Docker json-file ({"log":"…\n","stream":…,"time":…}) → body = nội dung dòng log.
      - type: container
        id: docker
        format: docker
        add_metadata_from_filepath: false
      # 2) Chỉ thử parse JSON khi dòng trông như object; lỗi parse vẫn đi tiếp (on_error: send), không bị bỏ.
      - type: json_parser
        id: parse_json
        if: 'body matches "^\\s*\\{"'
        parse_from: body
        on_error: send
      # 3) Không có trường `service` sau bước 2 ⇒ dòng rác/JSON hỏng: giữ nguyên body, gắn nhãn unparsed.
      - type: add
        id: mark_unparsed
        if: 'attributes["service"] == nil'
        field: attributes["unparsed"]
        value: "true"
      # 4) Dòng đã parse: ánh xạ sang OTel (resource semconv, body, severity, thời điểm, trace context).
      - type: move
        id: resource_service
        if: 'attributes["service"] != nil'
        from: attributes["service"]
        to: resource["service.name"]
      - type: move
        id: resource_version
        if: 'attributes["version"] != nil'
        from: attributes["version"]
        to: resource["service.version"]
      - type: move
        id: resource_env
        if: 'attributes["env"] != nil'
        from: attributes["env"]
        to: resource["deployment.environment"]
      - type: move
        id: body_msg
        if: 'attributes["msg"] != nil'
        from: attributes["msg"]
        to: body
      - type: severity_parser
        id: severity
        if: 'attributes["severity_number"] != nil'
        parse_from: attributes["severity_number"]
        mapping:
          debug: 5
          info: 9
          warn: 13
          error: 17
      - type: time_parser
        id: timestamp
        if: 'attributes["ts"] != nil'
        parse_from: attributes["ts"]
        layout_type: gotime
        layout: "2006-01-02T15:04:05.000Z07:00"
        on_error: send
      - type: trace_parser
        id: trace
        if: 'attributes["trace_id"] != nil'
        trace_id:
          parse_from: attributes["trace_id"]
        span_id:
          parse_from: attributes["span_id"]
        on_error: send
  # Đường OTLP cho tiến trình muốn gửi trực tiếp (loopback, không phơi ra mạng ngoài).
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Resource ở Collector: `insert` chỉ điền khi dòng chưa có (dòng JSON hợp lệ đã mang service/version/env của chính nó);
  # nhờ đó dòng rác vẫn truy vấn được theo service.name.
  resource/app:
    attributes:
      - key: service.name
        value: hotel-manager
        action: insert
      - key: service.version
        value: unknown
        action: insert
      - key: deployment.environment
        value: ${env:HM_DEPLOYMENT_ENV:-production}
        action: insert
  # OPS-OBS-008 / BASE-ERR-007: che PII/bí mật ở Collector TRƯỚC exporter — lớp thứ hai sau SDK (packages/app/src/logging/logger.ts
  # che trong tiến trình); bắt cả dòng không đi qua logger (stack của runtime, dòng rác, tiến trình gửi OTLP trực tiếp).
  # Phủ: Resource attributes, log attributes, body chuỗi (kể cả JSON thô) và body map (OTLP) — map được flatten trước (kể cả lồng).
  # Khoá nhạy cảm bị XOÁ; giá trị khớp mẫu bị che; SĐT/CCCD chạy hai lượt (biên RE2 ăn ký tự ⇒ số liền kề).
  # Không dùng processor `redaction` (alpha) nên KHÔNG có ignored_keys/allowed_keys/allowed_values: không khoá nào được miễn che,
  # không có allowlist fail-closed làm mất series — SLI/alert (deploy/prometheus) đọc metric Prometheus, không đọc log qua Collector.
  # error_mode: propagate — câu lệnh lỗi thì bỏ lô thay vì để lọt dữ liệu chưa che (mỗi câu trên body có `where` đúng kiểu).
  # Mẫu giữ đồng bộ với logger.ts (ở đây rộng hơn: khoá k=v có hậu tố, giá trị "…"); kiểm bằng dữ liệu exporter thực nhận: `node scripts/otel-collector-e2e.mjs` (canary từng vị trí).
  transform/redact:
    error_mode: propagate
    log_statements:
      - context: resource
        statements:
          - flatten(resource.attributes)
          - delete_matching_keys(resource.attributes, "(?i:pass|secret|token|authorization|cookie|api[_-]?key|session|otp|cccd|cmnd|passport|id[_-]?number|document[_-]?number|identity)|(?i:(^|[_.\\s-])keys?($|[_.\\s-]))|[a-z0-9]Keys?([^a-z]|$)")
          - replace_all_patterns(resource.attributes, "value", "(?i)\\b(bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "$${1} ***")
          - replace_all_patterns(resource.attributes, "value", "(?i)\\b([a-z][a-z0-9+.-]*://[^\\s:/@]+):[^\\s@/]+@", "$${1}:***@")
          - replace_all_patterns(resource.attributes, "value", "(?i)\\b([\\w-]*(pass(word|wd)?|pwd|secret|token|api[_-]?key)[\\w-]*)=(\\\\?\"[^\"\\\\]*\\\\?\"|[^\\s&;,\"\\\\]+)", "$${1}=***")
          - replace_all_patterns(resource.attributes, "value", "([A-Za-z0-9._%+-])[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+\\.[A-Za-z]{2,})", "$${1}***@$${2}")
          - replace_all_patterns(resource.attributes, "value", "(^|[^\\w-])(\\+?84|0)(\\d{2})\\d{4}(\\d{3})($|[^\\w-])", "$${1}0$${3}****$${4}$${5}")
          - replace_all_patterns(resource.attributes, "value", "(^|[^\\w-])(\\+?84|0)(\\d{2})\\d{4}(\\d{3})($|[^\\w-])", "$${1}0$${3}****$${4}$${5}")
          - replace_all_patterns(resource.attributes, "value", "(^|[^\\w-])(\\d{5}|\\d{8})(\\d{4})($|[^\\w-])", "$${1}****$${3}$${4}")
          - replace_all_patterns(resource.attributes, "value", "(^|[^\\w-])(\\d{5}|\\d{8})(\\d{4})($|[^\\w-])", "$${1}****$${3}$${4}")
      - context: log
        statements:
          - flatten(log.attributes)
          - delete_matching_keys(log.attributes, "(?i:pass|secret|token|authorization|cookie|api[_-]?key|session|otp|cccd|cmnd|passport|id[_-]?number|document[_-]?number|identity)|(?i:(^|[_.\\s-])keys?($|[_.\\s-]))|[a-z0-9]Keys?([^a-z]|$)")
          - replace_all_patterns(log.attributes, "value", "(?i)\\b(bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "$${1} ***")
          - replace_all_patterns(log.attributes, "value", "(?i)\\b([a-z][a-z0-9+.-]*://[^\\s:/@]+):[^\\s@/]+@", "$${1}:***@")
          - replace_all_patterns(log.attributes, "value", "(?i)\\b([\\w-]*(pass(word|wd)?|pwd|secret|token|api[_-]?key)[\\w-]*)=(\\\\?\"[^\"\\\\]*\\\\?\"|[^\\s&;,\"\\\\]+)", "$${1}=***")
          - replace_all_patterns(log.attributes, "value", "([A-Za-z0-9._%+-])[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+\\.[A-Za-z]{2,})", "$${1}***@$${2}")
          - replace_all_patterns(log.attributes, "value", "(^|[^\\w-])(\\+?84|0)(\\d{2})\\d{4}(\\d{3})($|[^\\w-])", "$${1}0$${3}****$${4}$${5}")
          - replace_all_patterns(log.attributes, "value", "(^|[^\\w-])(\\+?84|0)(\\d{2})\\d{4}(\\d{3})($|[^\\w-])", "$${1}0$${3}****$${4}$${5}")
          - replace_all_patterns(log.attributes, "value", "(^|[^\\w-])(\\d{5}|\\d{8})(\\d{4})($|[^\\w-])", "$${1}****$${3}$${4}")
          - replace_all_patterns(log.attributes, "value", "(^|[^\\w-])(\\d{5}|\\d{8})(\\d{4})($|[^\\w-])", "$${1}****$${3}$${4}")
          - flatten(log.body) where IsMap(log.body)
          - delete_matching_keys(log.body, "(?i:pass|secret|token|authorization|cookie|api[_-]?key|session|otp|cccd|cmnd|passport|id[_-]?number|document[_-]?number|identity)|(?i:(^|[_.\\s-])keys?($|[_.\\s-]))|[a-z0-9]Keys?([^a-z]|$)") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(?i)\\b(bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "$${1} ***") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(?i)\\b([a-z][a-z0-9+.-]*://[^\\s:/@]+):[^\\s@/]+@", "$${1}:***@") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(?i)\\b([\\w-]*(pass(word|wd)?|pwd|secret|token|api[_-]?key)[\\w-]*)=(\\\\?\"[^\"\\\\]*\\\\?\"|[^\\s&;,\"\\\\]+)", "$${1}=***") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "([A-Za-z0-9._%+-])[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+\\.[A-Za-z]{2,})", "$${1}***@$${2}") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(^|[^\\w-])(\\+?84|0)(\\d{2})\\d{4}(\\d{3})($|[^\\w-])", "$${1}0$${3}****$${4}$${5}") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(^|[^\\w-])(\\+?84|0)(\\d{2})\\d{4}(\\d{3})($|[^\\w-])", "$${1}0$${3}****$${4}$${5}") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(^|[^\\w-])(\\d{5}|\\d{8})(\\d{4})($|[^\\w-])", "$${1}****$${3}$${4}") where IsMap(log.body)
          - replace_all_patterns(log.body, "value", "(^|[^\\w-])(\\d{5}|\\d{8})(\\d{4})($|[^\\w-])", "$${1}****$${3}$${4}") where IsMap(log.body)
          # Body chuỗi: msg đã parse, dòng không parse được, hoặc dòng JSON parse được nhưng thiếu `msg` (body = JSON thô).
          - replace_pattern(log.body, "(\"(?:[^\"\\\\]*(?i:pass|secret|token|authorization|cookie|api[_-]?key|session|otp|cccd|cmnd|passport|id[_-]?number|document[_-]?number|identity)[^\"\\\\]*|(?:[^\"\\\\]*[_.-])?(?i:keys?)(?:[_.-][^\"\\\\]*)?|[^\"\\\\]*[a-z0-9]Keys?(?:[^a-z\"\\\\][^\"\\\\]*)?)\"\\s*:\\s*)(?:\"(?:[^\"\\\\]|\\\\.)*\"|-?\\d[\\d.eE+-]*|true|false|null)", "$${1}\"***\"") where IsString(log.body)
          - replace_pattern(log.body, "(?i)\\b(bearer|basic)\\s+[A-Za-z0-9._~+/=-]{8,}", "$${1} ***") where IsString(log.body)
          - replace_pattern(log.body, "(?i)\\b([a-z][a-z0-9+.-]*://[^\\s:/@]+):[^\\s@/]+@", "$${1}:***@") where IsString(log.body)
          - replace_pattern(log.body, "(?i)\\b([\\w-]*(pass(word|wd)?|pwd|secret|token|api[_-]?key)[\\w-]*)=(\\\\?\"[^\"\\\\]*\\\\?\"|[^\\s&;,\"\\\\]+)", "$${1}=***") where IsString(log.body)
          - replace_pattern(log.body, "([A-Za-z0-9._%+-])[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+\\.[A-Za-z]{2,})", "$${1}***@$${2}") where IsString(log.body)
          - replace_pattern(log.body, "(^|[^\\w-])(\\+?84|0)(\\d{2})\\d{4}(\\d{3})($|[^\\w-])", "$${1}0$${3}****$${4}$${5}") where IsString(log.body)
          - replace_pattern(log.body, "(^|[^\\w-])(\\+?84|0)(\\d{2})\\d{4}(\\d{3})($|[^\\w-])", "$${1}0$${3}****$${4}$${5}") where IsString(log.body)
          - replace_pattern(log.body, "(^|[^\\w-])(\\d{5}|\\d{8})(\\d{4})($|[^\\w-])", "$${1}****$${3}$${4}") where IsString(log.body)
          - replace_pattern(log.body, "(^|[^\\w-])(\\d{5}|\\d{8})(\\d{4})($|[^\\w-])", "$${1}****$${3}$${4}") where IsString(log.body)
  batch:
    timeout: 2s

exporters:
  file/logs:
    path: ${env:HM_LOG_EXPORT_PATH:-/var/log/hm-otel/logs.jsonl}
    rotation:
      max_megabytes: 100
      max_days: 14
      max_backups: 10

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [file_log/app, otlp]
      processors: [memory_limiter, resource/app, transform/redact, batch]
      exporters: [file/logs]
  telemetry:
    metrics:
      level: none
